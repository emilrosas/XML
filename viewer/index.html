<body>

<header>
  <div class="series">Henrik Ibsens skrifter · bind 5</div>
  <h1>Brand – et dramatisk digt (1866)</h1>
</header>

<div class="tab-bar">
  <button class="tab active">Tekst</button>
  <button class="tab">Kommentarer</button>
  <button class="tab">Manuskripter</button>
</div>

<div class="act-nav" id="act-nav">
  <span class="lbl">Gå til:</span>
</div>

<div class="main-layout">
  <div class="text-panel" id="text-panel">
    <div class="loading-msg">Laster tekst…</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header" id="sidebar-hdr">Kommentarer og noter</div>
    <div class="sidebar-body" id="sidebar-body">
      <div class="sidebar-empty">Klikk på et <span style="background:#9b7a14;color:#fff;border-radius:50%;display:inline-block;width:14px;height:14px;text-align:center;font-size:9px;line-height:14px;font-family:sans-serif">●</span> (kommentarmerke) eller på et <span style="border-bottom:1px dashed #9b7a14">understreket ord</span> (tekstkritisk note) for å lese kommentaren.</div>
    </div>
  </div>
</div>

<script>
// ---- Utilities ----
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function byLocal(parent, name) {
  // Works for both HTML and namespaced XML docs
  return [...parent.getElementsByTagName('*')].filter(el => el.localName === name);
}
function firstByLocal(parent, name) {
  return byLocal(parent, name)[0] || null;
}

// ---- Global stores ----
const comm = {};   // koBr_ID -> {term: html, gloss: html}
const tcn  = {};   // noteBr_ID -> html

// ---- Load XML ----
async function fetchXml(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  const txt = await r.text();
  return new DOMParser().parseFromString(txt, 'application/xml');
}

// ---- Render a secondary-file node to HTML (for sidebar) ----
function rSide(node) {
  if (node.nodeType === 3) return esc(node.textContent);
  if (node.nodeType !== 1) return '';
  const local = node.localName;
  const kids = () => [...node.childNodes].map(rSide).join('');
  switch (local) {
    case 'hi':
      return node.getAttribute('rend') === 'italic'
        ? `<em>${kids()}</em>`
        : node.getAttribute('rend') === 'bold'
          ? `<strong>${kids()}</strong>`
          : kids();
    case 'emph': return `<em>${kids()}</em>`;
    case 'quote': return `<blockquote>${kids()}</blockquote>`;
    case 'title': return `<em>${kids()}</em>`;
    case 'hisRef': return `<em>${kids()}</em>`;
    case 'ptr': return '';
    case 'seg': return kids();
    case 'ref': return kids();
    case 'note': return kids();
    // For TC notes: hisTerm and hisRef at start
    case 'hisTerm': return '';
    default: return kids();
  }
}

// ---- Parse commentary XML ----
function parseComm(doc) {
  for (const item of byLocal(doc, 'item')) {
    const ptr = firstByLocal(item, 'ptr');
    if (!ptr) continue;
    const id = ptr.getAttribute('corresp');
    if (!id) continue;
    const termEl = firstByLocal(item, 'hisTerm');
    const glossEl = firstByLocal(item, 'hisGloss');
    comm[id] = {
      term: termEl ? esc(termEl.textContent.trim()) : '',
      gloss: glossEl ? rSide(glossEl) : ''
    };
  }
}

// ---- Parse TC notes XML ----
function parseTcn(doc) {
  for (const note of byLocal(doc, 'note')) {
    const id = note.getAttribute('xml:id') || note.getAttribute('id');
    if (!id) continue;
    tcn[id] = rSide(note);
  }
}

// ---- Render main text nodes ----
function rMain(node) {
  if (node.nodeType === 3) return esc(node.textContent);
  if (node.nodeType !== 1) return '';
  const local = node.localName;
  const kids = () => [...node.childNodes].map(rMain).join('');
  const a = name => node.getAttribute(name);

  switch (local) {
    case 'TEI': case 'teiHeader': return '';
    case 'text': case 'body': case 'back': return kids();

    case 'front':
      return `<div class="front-matter">${kids()}</div>`;

    case 'titlePage':
      return `<div class="title-page">${kids()}</div>`;
    case 'docTitle': return kids();
    case 'titlePart': {
      const t = a('type') || 'main';
      return `<div class="title-${t}">${kids()}</div>`;
    }
    case 'byline': return `<div class="byline">${kids()}</div>`;
    case 'docAuthor': return kids();
    case 'hisDocImprint': return `<div class="imprint">${kids()}</div>`;
    case 'pubPlace': return `<div>${kids()}</div>`;
    case 'publisher': return `<div>${kids()}</div>`;
    case 'printer': return '';
    case 'hisPrinter': return '';
    case 'date': return `<div>${kids()}</div>`;

    case 'hisCastList': {
      return `<div class="cast-section">${kids()}</div>`;
    }
    case 'castList': return `<div class="cast-section">${kids()}</div>`;
    case 'castItem': {
      return `<div class="cast-item">${kids()}</div>`;
    }
    case 'role': return `<span class="cast-role">${kids()}</span>`;
    case 'roleDesc': return `<span class="cast-desc">, ${kids()}</span>`;

    case 'head': {
      const t = a('type');
      if (t === 'castList') return `<div class="cast-head">${kids()}</div>`;
      if (t === 'act') return `<h2 class="act-head">${kids()}</h2>`;
      if (t === 'scene') return `<div class="scene-head">${kids()}</div>`;
      return `<div class="scene-head">${kids()}</div>`;
    }

    case 'set': return `<div class="set-note">${kids()}</div>`;
    case 'p': return `<p style="margin:.5em 0;line-height:1.65">${kids()}</p>`;

    case 'div': {
      const t = a('type');
      const xmlid = a('xml:id') || a('id') || '';
      if (t === 'act') return `<section class="act"${xmlid ? ` id="${esc(xmlid)}"` : ''}>${kids()}</section>`;
      if (t === 'scene') return `<div class="scene">${kids()}</div>`;
      return kids();
    }

    case 'stage': return `<div class="stage-block">${kids()}</div>`;
    case 'hisStage': return ` <span class="stage-inline">${kids()}</span>`;

    case 'hisSp': return `<div class="speech">${kids()}</div>`;
    case 'spOpener': return `<div class="sp-opener">${kids()}</div>`;
    case 'speaker': return `<span class="speaker">${kids()}</span>`;

    case 'hisLg': case 'lg': return `<div class="stanza">${kids()}</div>`;
    case 'l': {
      const part = a('part');
      const cls = (part === 'M' || part === 'F') ? ' line-indent' : '';
      return `<div class="line${cls}">${kids()}</div>`;
    }

    case 'anchor': {
      const t = a('type');
      const id = a('xml:id') || a('id');
      if ((t === 'lemma' || t === 'ht') && id) {
        return `<span class="ko-mark" data-id="${esc(id)}" title="Kommentar">●</span>`;
      }
      return '';
    }

    case 'hisRef': {
      const t = a('type');
      const id = a('xml:id') || a('id');
      if (t === 'tcNote' && id) {
        return `<span class="tc-span" data-id="${esc(id)}">${kids()}</span>`;
      }
      return kids();
    }

    case 'emph': return `<em>${kids()}</em>`;
    case 'hi': {
      if (a('rend') === 'italic') return `<em>${kids()}</em>`;
      if (a('rend') === 'bold') return `<strong>${kids()}</strong>`;
      return kids();
    }
    case 'title': return `<em>${kids()}</em>`;
    case 'quote': return `<q>${kids()}</q>`;

    case 'note': {
      if (a('type') === 'met') return ''; // skip metrical annotation notes
      return '';
    }

    case 'pb': {
      const n = a('n');
      const ed = a('ed');
      // Only show main page numbers (not from specific editions)
      if (n && !ed) return `<span class="pb-num" title="Side ${n}">[${n}]</span>`;
      return '';
    }

    case 'seg': return kids();
    case 'choice': {
      // Prefer corr over orig
      const corrEl = [...node.childNodes].find(c => c.localName === 'corr');
      return corrEl ? rMain(corrEl) : kids();
    }
    case 'corr': return kids();
    case 'orig': return '';
    case 'del': return '';
    case 'add': return kids();
    case 'supplied': return `[${kids()}]`;
    case 'gap': return '[…]';
    case 'ref': return kids();

    // Skip
    case 'fw': case 'figure': case 'figDesc': return '';
    case 'list': case 'item': case 'label': return kids(); // for lists in front matter

    default: return kids();
  }
}

// ---- Build act navigation ----
function buildNav(doc) {
  const nav = document.getElementById('act-nav');
  const acts = [...doc.getElementsByTagName('*')]
    .filter(el => el.localName === 'div' && el.getAttribute('type') === 'act');

  acts.forEach((act, i) => {
    const id = act.getAttribute('xml:id') || act.getAttribute('id');
    const headEl = firstByLocal(act, 'head');
    let label = headEl ? headEl.textContent.trim().replace(/\s+/g,' ').substring(0,50) : `Handling ${i+1}`;
    const link = document.createElement('a');
    link.className = 'act-link';
    link.textContent = label;
    link.href = '#';
    link.onclick = e => {
      e.preventDefault();
      if (id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    nav.appendChild(link);
    if (i < acts.length - 1) {
      nav.appendChild(document.createTextNode(' · '));
    }
  });
}

// ---- Show in sidebar ----
function showSidebar(type, id) {
  const hdr = document.getElementById('sidebar-hdr');
  const body = document.getElementById('sidebar-body');

  // Clear active state
  document.querySelectorAll('.ko-mark.lit, .tc-span.lit').forEach(el => el.classList.remove('lit'));

  if (type === 'ko') {
    document.querySelectorAll(`.ko-mark[data-id="${id}"]`).forEach(el => el.classList.add('lit'));
    const entry = comm[id];
    hdr.textContent = 'Kommentar';
    if (entry) {
      body.innerHTML = `<div>
        <div class="comm-term">${entry.term}</div>
        <div class="comm-gloss">${entry.gloss}</div>
      </div>`;
    } else {
      body.innerHTML = `<div class="sidebar-empty">Ingen kommentar registrert for <em>${esc(id)}</em>.</div>`;
    }
  } else if (type === 'tc') {
    document.querySelectorAll(`.tc-span[data-id="${id}"]`).forEach(el => el.classList.add('lit'));
    const note = tcn[id];
    hdr.textContent = 'Tekstkritisk note';
    if (note) {
      body.innerHTML = `<div>
        <div class="tc-label">Tekstkritisk variant</div>
        <div class="tc-body">${note}</div>
      </div>`;
    } else {
      body.innerHTML = `<div class="sidebar-empty">Ingen note funnet for <em>${esc(id)}</em>.</div>`;
    }
  }
}

// ---- Main ----
async function main() {
  const panel = document.getElementById('text-panel');
  try {
    const [mainDoc, commDoc, tcDoc] = await Promise.all([
      fetchXml('../ibsen/drama/Br/Brht.xml'),
      fetchXml('../secondary/Drama/Br/Br_komm.xml'),
      fetchXml('../ibsen/drama/Br/Brht_noter.xml'),
    ]);

    parseComm(commDoc);
    parseTcn(tcDoc);

    // Find <text> in main doc
    const textEl = firstByLocal(mainDoc, 'text');
    if (!textEl) throw new Error('Ingen <text>-element funnet i XML');

    panel.innerHTML = rMain(textEl);
    buildNav(mainDoc);

    // Event delegation for clicks
    panel.addEventListener('click', e => {
      const km = e.target.closest('.ko-mark');
      const tc = e.target.closest('.tc-span');
      if (km) showSidebar('ko', km.dataset.id);
      else if (tc) showSidebar('tc', tc.dataset.id);
    });

  } catch (err) {
    panel.innerHTML = `<div class="error-msg"><strong>Feil ved lasting:</strong><br>${esc(err.message)}</div>`;
    console.error(err);
  }
}

main();
</script>
</body>
</html>
